name: Dotfiles checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      nvim_integration:
        description: Download and test the complete Neovim toolchain
        type: boolean
        default: false
      distro_acceptance:
        description: Test real install/rerun in disposable Debian 13 and Arch containers
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install check prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh neovim shellcheck python3
      - run: bash tests/check.sh
      - name: Commit whitespace
        run: git diff-tree --check --root -r -m HEAD
      - name: Install integration prerequisites
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.nvim_integration }}
        run: sudo apt-get install -y build-essential python3-venv python3-pip curl ca-certificates tar gzip unzip xz-utils
      - name: Neovim integration in a disposable home
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.nvim_integration }}
        timeout-minutes: 25
        run: bash tests/nvim.sh --integration
  distro-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.distro_acceptance }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, arch]
    steps:
      - uses: actions/checkout@v4
      - name: Install and rerun in disposable container
        shell: bash
        run: bash tests/acceptance.sh "${{ matrix.distro }}" |& tee acceptance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.distro }}
          path: acceptance.log
